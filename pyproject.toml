[project]
name = "pingwatch"
version = "0.1.0"
description = "A CLI tool that pings a website and returns useful info."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pingwatch = "pingwatch.main:main"
